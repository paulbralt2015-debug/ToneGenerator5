name: Build Tone Generator 5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Verify repository files
        run: |
          Write-Host "Current directory:"
          Get-Location
          Write-Host "Repository files:"
          Get-ChildItem source
          if (!(Test-Path "source/CMakeLists.txt")) {
            throw "CMakeLists.txt is missing from the repository root."
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Configure
        run: cmake -S source -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt
        run: windeployqt --release --compiler-runtime build/Release/ToneGenerator5.exe

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ToneGenerator5-Windows
          path: build/Release/**
          if-no-files-found: error
